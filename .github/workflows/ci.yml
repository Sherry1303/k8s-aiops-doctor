name: CI

# 每次 push / PR 都跑一遍离线检查：
# 语法编译 -> 单元测试（不需要集群、不需要 API Key）-> CLI 冒烟
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} @ ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          # README 声明支持 Python 3.9+；3.9 已 EOL，官方只提供 ubuntu-24.04 构建，故固定该镜像
          - os: ubuntu-24.04
            python-version: "3.9"
          # Windows 是本项目的主要开发环境（控制台编码、路径分隔符容易踩坑），单测与冒烟都要覆盖
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 语法编译检查
        run: python -m compileall -q k8s_doctor.py tests

      - name: 单元测试（离线：无需集群 / 无需 API Key / 不联网）
        run: python -m pytest -q

      - name: CLI 冒烟：--help
        run: python k8s_doctor.py --help
